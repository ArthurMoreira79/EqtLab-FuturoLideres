<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Diagnóstico inicial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Saira:ital,wght@1,700;1,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#280F91}a:hover{color:#1E2273}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F5FB; font-family: Figtree, sans-serif; color: #14174F; overflow: hidden">
<div style="background: #1E2273; color: #FFFFFF; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" aria-label="Voltar" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #280F91; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></button>
<img src="/_blob/fefc964dbd440f3cc890c3851b4b3972" alt="EQT Lab by Equatorial" style="width: 96px; height: auto; display: block">
<span style="font-size: 13px; color: #DCDDF5">Salvo</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #61D6FF; font-weight: 700">Parte B · Julgamento situacional</span>
<span style="font-family: Saira, sans-serif; font-style: italic; font-weight: 800; font-size: 26px">Diagnóstico inicial</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<div style="flex: 1; height: 8px; border-radius: 4px; background: #280F91"><div style="width: 58%; height: 8px; border-radius: 4px; background: #61D6FF"></div></div>
<span style="font-size: 14px; font-weight: 600">7 de 12</span>
</div>
</div>
<div style="flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
<div style="padding: 16px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E4F0; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; color: #7C3CB8; text-transform: uppercase; letter-spacing: 0.06em">Cenário · Operações de campo</span>
<p style="margin: 0; font-size: 16px; line-height: 1.5">Faltam dois dias para o fechamento das metas. Um técnico experiente entrega um relatório com erros pela terceira vez no mês. Qual a sua <strong>primeira</strong> reação?</p>
</div>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 14px; color: #5A5F86; margin-bottom: 10px">Escolha a opção mais adequada</legend>
<sc-for list="{{options}}" as="opt" hint-placeholder-count="4">
<button type="button" onClick="{{opt.pick}}" style="{{opt.style}}">
<span style="{{opt.dot}}"></span>
<span style="flex: 1; text-align: left">{{opt.label}}</span>
</button>
</sc-for>
</fieldset>
</div>
<div style="padding: 16px 20px 24px; display: flex; gap: 12px; background: #FFFFFF; border-top: 1px solid #E2E4F0">
<button type="button" style="min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid #E2E4F0; background: #FFFFFF; color: #14174F; font: inherit; font-weight: 600">Pular</button>
<a href="Resultado.dc.html" style="flex: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #280F91; color: #FFFFFF; font-weight: 700; text-decoration: none">Continuar</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { picked: 2 }; }
  renderVals() {
    const labels = [
      'Corrijo o relatório eu mesmo para não atrasar a entrega.',
      'Aponto os erros na reunião de equipe para ninguém repetir.',
      'Converso em particular, mostro os erros e entendo o que está acontecendo.',
      'Repasso a tarefa para outra pessoa da equipe.'
    ];
    return {
      options: labels.map((label, i) => {
        const on = this.state.picked === i;
        return {
          label,
          pick: () => this.setState({ picked: i }),
          style: 'display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 14px;border-radius:12px;font:inherit;font-size:15px;line-height:1.4;color:#14174F;cursor:pointer;' + (on ? 'background:#EEEAFB;border:2px solid #280F91;' : 'background:#FFFFFF;border:2px solid #E2E4F0;'),
          dot: 'flex:none;width:18px;height:18px;border-radius:50%;box-sizing:border-box;' + (on ? 'border:6px solid #280F91;' : 'border:2px solid #9A9EC4;')
        };
      })
    };
  }
}
</script>
</body>
</html>
